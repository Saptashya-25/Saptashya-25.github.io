<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV — Saptashya Ghosh</title>
<meta name="description" content="Curriculum vitae of Saptashya Ghosh, Research Associate in Information Systems at the Indian School of Business.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
(function(){
  try{
    var t = localStorage.getItem('theme');
    if(!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="cv.html" aria-current="page">CV</a></li>
      <li><a href="research.html">Research</a></li>
    </ul>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme">
    <svg class="icon-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2.6v2.1M12 19.3v2.1M4.3 4.3l1.5 1.5M18.2 18.2l1.5 1.5M2.6 12h2.1M19.3 12h2.1M4.3 19.7l1.5-1.5M18.2 5.8l1.5-1.5"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
      <path d="M20.3 14.9A8.5 8.5 0 0 1 9.1 3.7a8.5 8.5 0 1 0 11.2 11.2z"/>
    </svg>
  </button>
  </div>
</nav>

<div class="wrap">
  <div class="cv-panel">
    <h1 class="cv-heading">Curriculum Vitae</h1>
    <a class="cv-mark" href="Ghosh_CV.pdf">CV</a>
    <p class="cv-note">PDF</p>
  </div>
</div>

<script>
(function(){
  var btn = document.getElementById('themeToggle');
  if(!btn) return;
  function label(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
  }
  label();
  btn.addEventListener('click', function(){
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('theme', next); }catch(e){}
    label();
  });
})();
</script>
</body>
</html>
